<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои билеты — КиноПарк</title>
    <link rel="icon" href="/img/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header" id="site-header"></header>

    <main class="container">
        <div class="page-head"><h1>Личный кабинет</h1></div>
        <div class="account-layout">
            <aside class="card profile-card" id="profile"></aside>
            <section>

                    <button class="btn-filter" data-tab="past">История</button>
                </div>
                <div id="tickets"></div>
            </section>
        </div>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script type="module" src="/js/account.js"></script>
</body>
</html>
